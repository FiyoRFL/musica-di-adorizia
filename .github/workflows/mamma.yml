# Musica de Mama: compila la APK y la deja en Releases (tag mamma-vX.Y.Z)
name: Musica de Mama APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'mamma/**'
      - '.github/workflows/mamma.yml'
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Cantantes y discos de Discogs
        continue-on-error: true
        run: node mamma/scripts/discogs-artists.js
        env:
          DISCOGS_KEY: ${{ secrets.DISCOGS_KEY }}
          DISCOGS_SECRET: ${{ secrets.DISCOGS_SECRET }}
      - name: Version
        run: |
          echo "MAMMA_CODE=${{ github.run_number }}" >> $GITHUB_ENV
          echo "MAMMA_VERSION=1.0.${{ github.run_number }}" >> $GITHUB_ENV
      - name: Compilar APK
        working-directory: mamma
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Nombrar APK
        run: mkdir -p out && cp mamma/app/build/outputs/apk/release/*.apk "out/MusicaDeMama-${MAMMA_VERSION}.apk"
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "mamma-v${MAMMA_VERSION}" out/*.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Música de Mamá ${MAMMA_VERSION}" \
            --notes "Música de Mamá: música italiana de todos los tiempos (Discogs + YouTube con pantalla apagada). Bajala desde el celu y abrila para instalar." \
            --latest=false
