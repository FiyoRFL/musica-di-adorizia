<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Música de Mamá</title>
<style>
@font-face{font-family:Inter;src:url(fonts/inter-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Inter;src:url(fonts/inter-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:Inter;src:url(fonts/inter-700.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:Inter;src:url(fonts/inter-800.woff2) format("woff2");font-weight:800;font-display:swap}
:root{
  --ink:#1d1d1f; --soft:#6e6e73; --line:rgba(0,0,0,.08);
  --glass:rgba(255,255,255,.62); --glass2:rgba(255,255,255,.80); --edge:rgba(255,255,255,.75);
  --accent:#fa2d48; --accent2:#ff6a3d; --blue:#0a84ff; --shadow:0 8px 30px rgba(32,20,60,.14);
  --wall:
    radial-gradient(120% 70% at 10% 0%, #2b3a8f 0%, rgba(43,58,143,0) 60%),
    radial-gradient(90% 60% at 100% 10%, #8d3fb5 0%, rgba(141,63,181,0) 60%),
    radial-gradient(120% 60% at 0% 60%, #ff7a59 0%, rgba(255,122,89,0) 60%),
    radial-gradient(120% 70% at 100% 70%, #ff4f7b 0%, rgba(255,79,123,0) 60%),
    radial-gradient(140% 70% at 50% 110%, #ffb36b 0%, rgba(255,179,107,0) 70%),
    linear-gradient(180deg,#3a4ab0 0%,#c0567f 50%,#ff9466 100%);
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#f5f5f7; --soft:#a1a1a6; --line:rgba(255,255,255,.10);
    --glass:rgba(30,30,36,.58); --glass2:rgba(44,44,52,.80); --edge:rgba(255,255,255,.10);
    --shadow:0 8px 30px rgba(0,0,0,.45);
    --wall:
      radial-gradient(120% 70% at 10% 0%, #0b1240 0%, rgba(11,18,64,0) 60%),
      radial-gradient(90% 60% at 100% 10%, #3a1555 0%, rgba(58,21,85,0) 60%),
      radial-gradient(120% 60% at 0% 70%, #7a2a3a 0%, rgba(122,42,58,0) 60%),
      radial-gradient(120% 70% at 100% 80%, #5a1c4f 0%, rgba(90,28,79,0) 60%),
      linear-gradient(180deg,#0a0e2a 0%,#2a1236 55%,#4a1a2a 100%);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#3a4ab0}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,-apple-system,"SF Pro Text",Roboto,system-ui,sans-serif;font-size:19px;-webkit-font-smoothing:antialiased;background:var(--wall);background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
svg{display:block}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--edge);box-shadow:var(--shadow)}

/* barra de arriba (como la de una ventana de Mac) */
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border-bottom:1px solid var(--line)}
header .lights{display:flex;gap:7px;margin-right:2px}
header .lights i{width:12px;height:12px;border-radius:50%;display:block;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
header .lights i:nth-child(1){background:#ff5f57}header .lights i:nth-child(2){background:#febc2e}header .lights i:nth-child(3){background:#28c840}
header h1{font-size:21px;margin:0;font-weight:700;flex:1;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .back{width:44px;height:44px;border-radius:50%;display:none;align-items:center;justify-content:center;background:var(--glass2);border:1px solid var(--edge)}
header .back.show{display:flex}
header .back.show + .lights{display:none}
main{padding:18px 16px 200px;max-width:720px;margin:0 auto}
.view{display:none;animation:in .28s ease}.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* inicio */
.hello{color:#fff;margin:6px 4px 16px;text-shadow:0 1px 12px rgba(0,0,0,.25)}
.hello small{display:block;font-size:16px;opacity:.9;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.hello b{display:block;font-size:32px;font-weight:800;letter-spacing:-.03em;margin-top:2px}
.hero-play{position:relative;display:block;width:100%;text-align:left;border-radius:24px;padding:22px 22px 20px;margin:0 0 16px;color:#fff;overflow:hidden;
  background:linear-gradient(135deg,#ff2d55 0%,#ff6a3d 55%,#ffb340 100%);box-shadow:0 14px 40px rgba(255,45,85,.40)}
.hero-play::after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero-play .flag{display:inline-flex;gap:0;border-radius:4px;overflow:hidden;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.hero-play .flag i{width:12px;height:16px;display:block}
.hero-play b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15;max-width:80%}
.hero-play small{display:block;font-size:16px;opacity:.92;margin-top:6px}
.hero-play .go{position:absolute;right:20px;bottom:20px;width:62px;height:62px;border-radius:50%;background:#fff;color:#ff2d55;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.2);z-index:1}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 16px}
.trio button{border-radius:20px;padding:12px 8px 12px;text-align:center}
.trio img,.trio .ph{width:100%;aspect-ratio:1;border-radius:22%;object-fit:cover;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#c9c9ce,#e8e8ed);font-size:34px}
.trio b{display:block;font-size:15px;font-weight:700;margin-top:8px;line-height:1.2}

/* listas agrupadas (como Ajustes de Mac) */
.group{border-radius:18px;overflow:hidden;margin:0 0 16px}
.group > *:not(:last-child){border-bottom:1px solid var(--line)}
.big,.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px;min-height:72px;background:transparent}
.group .big,.group .row{border-radius:0}
.big{font-size:20px;font-weight:700;letter-spacing:-.01em}
.big small{display:block;font-size:15px;color:var(--soft);font-weight:400;margin-top:2px;letter-spacing:0}
.big .ico{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.big .chev,.row .go{margin-left:auto;color:var(--soft);flex:none}
.big:active,.row:active,.tile:active,.trio button:active{background:rgba(127,127,127,.12)}
.row img,.row .ph{width:56px;height:56px;border-radius:12px;object-fit:cover;background:linear-gradient(135deg,#c9c9ce,#e8e8ed);flex:none;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:18px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.row .t span{display:block;font-size:15px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.row .go{font-size:22px;color:var(--accent)}
.row.now .t b{color:var(--accent)}
.lst{border-radius:18px;overflow:hidden;margin:0 0 16px}
.lst > .row:not(:last-child){border-bottom:1px solid var(--line)}
h2{font-size:22px;font-weight:800;margin:24px 6px 10px;letter-spacing:-.02em;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.25)}

/* cantantes */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{border-radius:20px;padding:10px 8px 12px;text-align:center}
.tile img,.tile .ph{width:100%;aspect-ratio:1;border-radius:22%;object-fit:cover;background:linear-gradient(135deg,#c9c9ce,#e8e8ed);display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.tile b{display:block;font-size:15px;font-weight:700;margin-top:8px;line-height:1.2;letter-spacing:-.01em}
.hero{display:flex;gap:16px;align-items:center;margin:0 0 16px;padding:16px;border-radius:22px}
.hero img,.hero .ph{width:110px;height:110px;border-radius:22%;object-fit:cover;background:linear-gradient(135deg,#c9c9ce,#e8e8ed);flex:none;display:flex;align-items:center;justify-content:center;font-size:52px;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.hero h3{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.hero p{margin:6px 0 0;color:var(--soft);font-size:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--blue);color:#fff;border-radius:16px;padding:16px;font-size:19px;font-weight:700;margin:0 0 14px;box-shadow:0 6px 18px rgba(10,132,255,.35)}
.btn.red{background:linear-gradient(135deg,#ff2d55,#ff6a3d);box-shadow:0 6px 18px rgba(255,45,85,.35)}
.note{border-radius:16px;padding:14px 16px;font-size:16px;line-height:1.5;color:var(--ink);margin:0 0 14px;background:var(--glass);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border:1px solid var(--edge)}
.search{width:100%;font:inherit;font-size:20px;padding:15px 18px;border-radius:16px;border:1px solid var(--edge);background:var(--glass2);color:var(--ink);margin:0 0 12px;outline:none;-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px)}
.search:focus{box-shadow:0 0 0 4px rgba(10,132,255,.35)}
.msg{text-align:center;color:#fff;padding:30px 10px;font-size:17px;text-shadow:0 1px 8px rgba(0,0,0,.3)}
.spin{display:inline-block;width:26px;height:26px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:s .9s linear infinite;vertical-align:middle}
@keyframes s{to{transform:rotate(360deg)}}

/* mini reproductor flotante */
#bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:10;display:none;align-items:center;gap:12px;padding:10px 10px 10px 10px;border-radius:22px;background:var(--glass2);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--edge);box-shadow:0 12px 40px rgba(0,0,0,.28);max-width:696px;margin:0 auto}
#bar.show{display:flex;animation:in .3s ease}
#bar .art{width:56px;height:56px;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#c9c9ce,#e8e8ed);flex:none;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.18)}
#bar .t{flex:1;min-width:0}
#bar .t b{display:block;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .t span{display:block;font-size:14px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .pp,#bar .nx{width:52px;height:52px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center}
#bar .pp{background:var(--ink);color:var(--glass2)}
#bar .pp svg{fill:currentColor}
#bar .prog{position:absolute;left:18px;right:18px;bottom:4px;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
#bar .prog i{display:block;height:100%;width:0;background:var(--accent);transition:width 1s linear}

/* reproductor grande */
#full{position:fixed;inset:0;z-index:20;color:#fff;display:none;flex-direction:column;align-items:center;padding:calc(16px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));overflow:auto;background:#1c1c1e}
#full.show{display:flex;animation:up .32s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#f-bg{position:fixed;inset:-60px;z-index:-1;background-size:cover;background-position:center;filter:blur(60px) saturate(160%) brightness(.65);transform:scale(1.2);background-color:#3a2a4a}
#full .grab{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.45);margin:4px 0 6px}
#full .close{align-self:stretch;display:flex;justify-content:center;padding:6px}
#full .art{width:min(80vw,360px);aspect-ratio:1;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.12);margin:22px 0 26px;display:flex;align-items:center;justify-content:center;box-shadow:0 24px 60px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#full.paused .art{transform:scale(.86)}
#full .info{align-self:stretch}
#full h3{font-size:24px;font-weight:800;margin:0;letter-spacing:-.02em;line-height:1.2}
#full p{font-size:18px;margin:4px 0 0;color:rgba(255,255,255,.72)}
#f-prog{align-self:stretch;margin-top:22px}
#f-range{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
#f-range::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,#fff var(--p,0%),rgba(255,255,255,.28) var(--p,0%))}
#f-range::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;margin-top:-6px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
#full .times{display:flex;justify-content:space-between;font-size:14px;color:rgba(255,255,255,.65);font-variant-numeric:tabular-nums}
#full .ctl{display:flex;align-items:center;justify-content:center;gap:34px;margin:20px 0 22px}
#full .ctl button{width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
#full .ctl button svg{fill:currentColor}
#full .ctl .pp{width:96px;height:96px;background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
#full .ctl button:active{background:rgba(255,255,255,.18)}
#full .ctl button:disabled{opacity:.3}
#full .sleep{align-self:stretch;margin-top:auto}
#full .sleep b{display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;margin-bottom:10px;font-weight:600;color:rgba(255,255,255,.85)}
#full .seg{display:grid;grid-template-columns:repeat(4,1fr);padding:4px;border-radius:14px;background:rgba(255,255,255,.14)}
#full .seg button{border-radius:10px;padding:12px 0;font-size:16px;font-weight:600;color:#fff}
#full .seg button.on{background:#fff;color:#1d1d1f;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#full .err{background:rgba(255,59,48,.9);color:#fff;padding:10px 14px;border-radius:12px;margin-bottom:12px;font-size:16px;display:none;align-self:stretch;text-align:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom));z-index:15;max-width:88%;background:rgba(30,30,32,.86);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;padding:13px 20px;border-radius:999px;font-size:16px;font-weight:600;text-align:center;transition:opacity .3s;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<header>
  <button class="back" id="back" onclick="goBack()" aria-label="Volver"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <span class="lights"><i></i><i></i><i></i></span>
  <h1 id="title">Música de Mamá</h1>
</header>
<main>
  <!-- INICIO -->
  <section class="view on" id="v-home">
    <div class="hello"><small id="hello-day"></small><b id="hello-txt">Ciao, mamma</b></div>
    <button class="hero-play" onclick="playTodos()">
      <span class="flag"><i style="background:#009246"></i><i style="background:#fff"></i><i style="background:#ce2b37"></i></span>
      <b>Música italiana de todos los tiempos</b>
      <small id="hero-count">Tocá y escuchá sin parar</small>
      <span class="go"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.87l11-6.5a1 1 0 0 0 0-1.74l-11-6.5A1 1 0 0 0 8 5.5z"/></svg></span>
    </button>
    <div class="trio" id="trio"></div>
    <div class="group glass">
      <button class="big" onclick="show('fav')"><span class="ico" style="background:linear-gradient(135deg,#ff375f,#ff2d55)"><svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg></span><span>Eros · Laura · Bocelli<small>Sus canciones de siempre</small></span><span class="chev">›</span></button>
      <button class="big" onclick="show('artists')"><span class="ico" style="background:linear-gradient(135deg,#bf5af2,#8944ab)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><rect x="8.5" y="2.5" width="7" height="12" rx="3.5" fill="#fff" stroke="none"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg></span><span>Cantantes<small id="artists-count">Elegí un cantante</small></span><span class="chev">›</span></button>
      <button class="big" onclick="show('search')"><span class="ico" style="background:linear-gradient(135deg,#0a84ff,#0060df)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></span><span>Buscar<small>Un cantante, un disco o una canción</small></span><span class="chev">›</span></button>
    </div>
  </section>

  <!-- CANTANTES -->
  <section class="view" id="v-artists"><div class="grid" id="artist-grid"></div></section>

  <!-- LOS DE MAMA -->
  <section class="view" id="v-fav"></section>

  <!-- BUSCAR -->
  <section class="view" id="v-search">
    <form onsubmit="event.preventDefault();doSearch()"><input class="search" id="sq" type="search" enterkeyhint="search" placeholder="Ej: Eros Ramazzotti, Con te partirò"></form>
    <button class="btn" onclick="doSearch()">Buscar</button>
    <div id="search-res"></div>
  </section>

  <!-- UN CANTANTE -->
  <section class="view" id="v-artist"></section>

  <!-- UN DISCO -->
  <section class="view" id="v-album"></section>
</main>

<!-- mini reproductor -->
<div id="bar" onclick="openFull(event)">
  <div class="art" id="bar-art"></div>
  <div class="t"><b id="bar-title"></b><span id="bar-artist"></span></div>
  <button class="pp" id="bar-pp" onclick="event.stopPropagation();Android.cmd('toggle')" aria-label="Pausa"></button>
  <button class="nx" id="bar-nx" onclick="event.stopPropagation();Android.cmd('next')" aria-label="Siguiente"></button>
  <div class="prog"><i id="bar-prog"></i></div>
</div>

<!-- reproductor grande -->
<div id="full">
  <div id="f-bg"></div>
  <button class="close" onclick="closeFull()" aria-label="Cerrar"><span class="grab"></span></button>
  <div class="art" id="f-art"></div>
  <div class="info"><h3 id="f-title"></h3><p id="f-artist"></p></div>
  <div id="f-prog">
    <input type="range" id="f-range" min="0" max="1000" value="0" oninput="this.style.setProperty('--p',this.value/10+'%')" onchange="Android.seek(Math.round(this.value/1000*S.dur))">
    <div class="times"><span id="f-pos">0:00</span><span id="f-dur">0:00</span></div>
  </div>
  <div class="ctl">
    <button id="f-prev" onclick="Android.cmd('prev')" aria-label="Anterior"></button>
    <button class="pp" id="f-pp" onclick="Android.cmd('toggle')" aria-label="Pausa"></button>
    <button id="f-next" onclick="Android.cmd('next')" aria-label="Siguiente"></button>
  </div>
  <div class="err" id="f-err"></div>
  <div class="sleep">
    <b id="f-sleep-txt"></b>
    <div class="seg">
      <button data-m="15" onclick="setSleep(15)">15 min</button>
      <button data-m="30" onclick="setSleep(30)">30 min</button>
      <button data-m="60" onclick="setSleep(60)">1 hora</button>
      <button data-m="0" onclick="setSleep(0)">No</button>
    </div>
  </div>
</div>

<script src="keys.js"></script>
<script>
'use strict';
// ---------- iconos (estilo Apple) ----------
const IC = {
  play: '<svg width="26" height="26" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.87l11-6.5a1 1 0 0 0 0-1.74l-11-6.5A1 1 0 0 0 8 5.5z"/></svg>',
  pause: '<svg width="26" height="26" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4.2" height="15" rx="1.3"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.3"/></svg>',
  next: '<svg width="34" height="34" viewBox="0 0 32 24"><path d="M3 5.3v13.4a1 1 0 0 0 1.5.86L15 13.1v5.6a1 1 0 0 0 1.5.86l11-6.7a1 1 0 0 0 0-1.72l-11-6.7A1 1 0 0 0 15 5.3v5.6L4.5 4.44A1 1 0 0 0 3 5.3z"/></svg>',

function http(url) {
  return new Promise((ok, bad) => {
    const id = 'r' + (++reqN);
    waiting[id] = (st, txt) => {
      if (st >= 200 && st < 300) { try { ok(JSON.parse(txt)); } catch (e) { bad(e); } }

function discogs(path) {
  const key = 'dg:' + path;

  const p = dq.then(async () => {
    for (let i = 0; i < 3; i++) {
      const auth = window.DGK ? (path.includes('?') ? '&' : '?') + 'key=' + DGK + '&secret=' + DGS : '';
      try { const d = await http('https://api.discogs.com' + path + auth); store.set(key, d); return d; }
      catch (e) { if (e.status === 429) { await new Promise(r => setTimeout(r, 20000)); continue; } throw e; }

const BADV = /full album|album completo|álbum completo|intervista|interview|karaoke|tutorial|reaction|8d audio|slowed|medley/i;
function ytId(u) { const m = /(?:v=|youtu\.be\/|embed\/)([\w-]{11})/.exec(u || ''); return m ? m[1] : null; }
function cleanTitle(t, artist) {
  let s = String(t || '');
  const a = norm(artist).split(' ')[0];
  s = s.replace(/\((official|video|audio|videoclip|lyric|testo|hd|hq|remaster)[^)]*\)|\[(official|video|audio|hd|hq|remaster)[^\]]*\]/gi, '');
  const parts = s.split(/\s[-–—]\s/);
  if (parts.length > 1 && norm(parts[0]).includes(a)) s = parts.slice(1).join(' - ');
  return s.replace(/\s{2,}/g, ' ').trim();
}
const tidy = t => String(t || '').replace(/\[[^\]]*\]/g, '').replace(/\((19|20)\d\d\)/g, '').replace(/\s{2,}/g, ' ').replace(/^[\s\-–—:]+|[\s\-–—:]+$/g, '').trim() || String(t || '');
// saca el nombre del cantante pegado al titulo ("Io Amo - Fausto Leali", "Fausto Leali: Io Amo")
function songTitle(t, artist) {
  let x = tidy(t);
  const first = norm(artist).split(' ')[0];
  const parts = x.split(/\s[-–—]\s|:\s/);
  if (parts.length > 1 && first.length > 2) {
    const keep = parts.filter(p => !norm(p).includes(first));
    if (keep.length && keep.length < parts.length) x = keep.join(' - ');

}
function ytItem(s, artist) {

function videosOf(m, artist, al) {

}

async function loadAlbums(a) {

  const albums = [];
  const seen = new Set();
  for (let page = 1; page <= 2; page++) {
    const d = await discogs(`/artists/${a.id}/releases?sort=year&sort_order=desc&per_page=100&page=${page}`);
    (d.releases || []).forEach(r => {
      if (r.type !== 'master' || r.role !== 'Main' || !r.year) return;
      const k = norm(r.title); if (seen.has(k)) return; seen.add(k);
      albums.push({ id: r.id, title: r.title, year: r.year, cover: r.thumb || '' });
    });
    if (!d.pagination || page >= d.pagination.pages) break;
  }
  a.albums = albums;
  return albums;
}
async function loadSongs(a) {
  if (a.songs && a.songs.length) return a.songs;
  const albums = await loadAlbums(a);
  const songs = []; const seen = new Set();
  const step = Math.max(1, Math.floor(albums.length / 8));
  for (const al of albums.filter((_, i) => i % step === 0).slice(0, 8)) {
    try {
      const m = await discogs('/masters/' + al.id);
      videosOf(m, a.name, al).slice(0, 4).forEach(s => { const k = norm(s.t); if (!seen.has(k)) { seen.add(k); songs.push(s); } });
    } catch (e) {}
  }
  a.songs = songs;
  return songs;
}

let S = { playing: false, idle: true, title: '', artist: '', dur: 0, pos: 0 };
function playQueue(list, i) {
  const q = list.slice(0, 500).map(s => ({ url: s.url, title: s.title || '', artist: s.artist || '', art: s.art || '' }));
  Android.play(JSON.stringify(q), i);
  toast('♪ ' + (q[i] && q[i].title || ''));
}
function artHtml(src) { return src ? `<img src="${esc(src)}" onerror="this.outerHTML=IC.note" alt="" style="width:100%;height:100%;object-fit:cover">` : IC.note; }
let lastArt = null;
window.onPlayer = function (s) {
  S = s;
  $('bar').classList.toggle('show', !s.idle);
  const ic = s.buffering && s.wants ? IC.load : (s.wants ? IC.pause : IC.play);
  const big = ic.replace(/width="26" height="26"/, 'width="44" height="44"');
  if ($('bar-pp').dataset.ic !== ic) { $('bar-pp').dataset.ic = ic; $('bar-pp').innerHTML = ic; $('f-pp').innerHTML = big; }
  if (!$('f-next').innerHTML) { $('f-next').innerHTML = IC.next; $('f-prev').innerHTML = IC.prev; $('bar-nx').innerHTML = IC.next.replace('width="34" height="34"', 'width="28" height="28" fill="currentColor"'); }
  $('full').classList.toggle('paused', !s.wants);
  $('bar-title').textContent = s.title; $('bar-artist').textContent = s.artist;
  $('f-title').textContent = s.title; $('f-artist').textContent = s.artist;
  const art = s.art && !s.art.startsWith('content:') ? s.art : '';
  if (art !== lastArt) {
    lastArt = art;
    $('bar-art').innerHTML = artHtml(art); $('f-art').innerHTML = artHtml(art);
    $('f-bg').style.backgroundImage = art ? `url("${art.replace(/"/g, '%22')}")` : '';
  }
  $('f-next').disabled = !s.hasNext;
  $('bar-nx').style.opacity = s.hasNext ? 1 : .3;
  const p = s.dur > 0 ? Math.min(100, s.pos / s.dur * 100) : 0;
  $('bar-prog').style.width = p + '%';
  if (s.dur > 0) {
    if (document.activeElement !== $('f-range')) { $('f-range').value = Math.round(p * 10); $('f-range').style.setProperty('--p', p + '%'); }
    $('f-pos').textContent = fmt(s.pos); $('f-dur').textContent = '-' + fmt(s.dur - s.pos);
  }
  const e = $('f-err'); e.textContent = s.error; e.style.display = s.error ? 'block' : 'none';
  const left = s.sleepAt ? Math.max(0, Math.ceil((s.sleepAt - Date.now()) / 60000)) : 0;
  $('f-sleep-txt').innerHTML = IC.moon + (left ? ` Se apaga en ${left} min` : ' Apagar la música en…');
  if (!left) document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', false));
};
function setSleep(m) {
  Android.sleep(m);
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', +b.dataset.m === m && m > 0));
  toast(m ? `La música se apaga en ${m >= 60 ? '1 hora' : m + ' minutos'}` : 'Sin apagado automático');
}
function openFull() { if (!S.idle) $('full').classList.add('show'); }
function closeFull() { $('full').classList.remove('show'); }

// avisito abajo
let tt;
function toast(t) {
  let el = $('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
  el.textContent = t; el.style.opacity = 1;
  clearTimeout(tt); tt = setTimeout(() => el.style.opacity = 0, 2400);
}
</script>
</body>
