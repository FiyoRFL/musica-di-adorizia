<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Musica di Adorizia</title>
<style>
/* Musica di Adorizia - tema oscuro estilo Claude, con los colores de Italia.
   Fondo carbon calido, superficies apenas mas claras, saludo en serif centrado,
   una caja principal redondeada y botones tipo pastilla.
   El rojo de la bandera es la accion (escuchar, play); el verde, el progreso. */
@font-face{font-family:News;src:url(fonts/newsreader-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:News;src:url(fonts/newsreader-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:Atkinson;src:url(fonts/atkinson-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Atkinson;src:url(fonts/atkinson-700.woff2) format("woff2");font-weight:700;font-display:swap}
:root{
  --bg:#262624;        /* fondo carbon calido */
  --surface:#30302E;   /* cajas y barras */
  --surface2:#3A3936;  /* al tocar / elegido */
  --line:rgba(245,244,238,.10);
  --ink:#F5F4EE;       /* blanco calido (el blanco de la bandera) */
  --soft:#A7A49B;
  --rosso:#D7333A;     /* rojo Italia (accion) */
  --rosso-d:#B0252C;
  --verde:#2EA06A;     /* verde Italia (progreso / activo) */
  --s1:19px; --s2:23px; --s3:28px; --s4:36px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Atkinson,Roboto,system-ui,sans-serif;font-size:var(--s1);line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:left}
button:focus-visible,input:focus-visible{outline:2px solid var(--verde);outline-offset:3px;border-radius:12px}
svg{display:block}
.glass{background:transparent}

/* barra de arriba (solo fuera del inicio) */
header{position:sticky;top:0;z-index:5;display:none;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
header.show{display:flex}
header .back{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
header .back:active{background:var(--surface)}
header h1{font-family:News,Georgia,serif;font-weight:500;font-size:var(--s2);margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding:calc(28px + env(safe-area-inset-top)) 18px 180px;max-width:640px;margin:0 auto}
header.show + main{padding-top:18px}
.view{display:none}.view.on{display:block}

/* ---- inicio ---- */
.home-top{text-align:center;margin:8vh 0 26px}
.mark{display:inline-flex;gap:5px;margin-bottom:16px}
.mark i{width:9px;height:9px;border-radius:50%;display:block}
.hello{font-family:News,Georgia,serif;font-weight:400;font-size:var(--s4);line-height:1.15;margin:0;letter-spacing:-.01em}
.count{color:var(--soft);margin:10px 0 0;font-size:17px}

.composer{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.composer .ask{display:flex;align-items:center;gap:12px;width:100%;padding:10px 8px 16px;color:var(--soft);font-size:var(--s1)}
.composer .ask svg{stroke:var(--soft);flex:none}
.play-all{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:64px;border-radius:14px;background:var(--rosso);color:#fff;font-size:var(--s2);font-weight:700}
.play-all:active{background:var(--rosso-d)}
.play-all svg{fill:#fff}

.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0 0}
.chip{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:6px 18px 6px 8px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:700;font-size:18px}
.chip:active{background:var(--surface)}
.chip img,.chip .ph{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.chip .ic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface2);flex:none}
.chip .ic svg{stroke:var(--ink)}

.nowcard{display:none;align-items:center;gap:14px;margin:26px 0 0;padding:12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);width:100%}
.nowcard.show{display:flex}
.nowcard .art{width:56px;height:56px;border-radius:10px;overflow:hidden;background:var(--surface2);flex:none;display:flex;align-items:center;justify-content:center}
.nowcard .art svg{width:45%;height:45%;fill:var(--soft)}
.nowcard .art img{width:100%;height:100%;object-fit:cover}
.nowcard .t{flex:1;min-width:0}
.nowcard small{display:block;color:var(--verde);font-size:15px;font-weight:700}
.nowcard b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowcard span{display:block;color:var(--soft);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

h2{font-family:News,Georgia,serif;font-weight:500;font-size:var(--s3);margin:30px 2px 12px;line-height:1.15}

/* listas: filas limpias, como la barra lateral de Claude */
.menu,.lst{margin:0 0 8px}
.big,.row{display:flex;align-items:center;gap:14px;width:100%;padding:10px 10px;min-height:72px;border-radius:14px}
.big:active,.row:active,.tile:active,.chip:active{background:var(--surface)}
.big{font-size:var(--s1);font-weight:700}
.big small{display:block;font-size:16px;color:var(--soft);font-weight:400;margin-top:2px}
.big .ico{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--surface)}
.big .ico svg{stroke:var(--ink)}
.big .chev,.row .go{margin-left:auto;flex:none;color:var(--soft)}
.row img,.row .ph{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--surface);flex:none;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--soft)}
.row .ph svg{fill:var(--soft)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t span{display:block;font-size:16px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.row .go svg{fill:var(--soft)}
.row.now{background:var(--surface)}
.row.now .t b{color:var(--verde)}

/* cantantes */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 12px}
.tile{text-align:center;display:block;border-radius:16px;padding:8px 4px}
.tile img,.tile .ph{width:100%;aspect-ratio:1;border-radius:50%;object-fit:cover;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:36px}
.tile b{display:block;font-weight:700;font-size:16px;margin-top:8px;line-height:1.25}

.hero{display:flex;gap:16px;align-items:center;margin:6px 0 20px}
.hero img,.hero .ph{width:104px;height:104px;border-radius:50%;object-fit:cover;background:var(--surface);flex:none;display:flex;align-items:center;justify-content:center;font-size:44px}
.hero h3{font-family:News,Georgia,serif;font-weight:500;font-size:var(--s3);margin:0;line-height:1.15}
.hero p{margin:6px 0 0;color:var(--soft)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:700;margin:0 0 16px;text-align:center}
.btn.red{background:var(--rosso);border-color:var(--rosso);color:#fff}
.btn.red:active{background:var(--rosso-d)}
.btn svg{stroke:currentColor}
.note{padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);margin:0 0 16px;line-height:1.5;color:var(--soft)}
.search{width:100%;font:inherit;font-size:var(--s1);padding:16px 18px;border-radius:18px;border:1px solid var(--line);background:var(--surface);color:var(--ink);margin:0 0 12px;outline:none}
.search::placeholder{color:var(--soft)}
.search:focus{border-color:var(--verde)}
.msg{text-align:center;color:var(--soft);padding:28px 10px}
.spin{display:inline-block;width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--verde);border-radius:50%;animation:s .9s linear infinite;vertical-align:middle}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:3s}}

/* mini reproductor flotante */
#bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:10;display:none;align-items:center;gap:12px;padding:10px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.45);max-width:616px;margin:0 auto;overflow:hidden}
#bar.show{display:flex}
#bar .art{width:54px;height:54px;border-radius:10px;overflow:hidden;flex:none;background:var(--surface2);display:flex;align-items:center;justify-content:center}
#bar .art img{width:100%;height:100%;object-fit:cover}
#bar .art svg{width:45%;height:45%;fill:var(--soft)}
#bar .t{flex:1;min-width:0}
#bar .t b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .t span{display:block;font-size:15px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .pp{width:56px;height:56px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--rosso);color:#fff}
#bar .pp svg{fill:#fff}
#bar .nx{width:48px;height:48px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center}
#bar .nx svg{fill:var(--ink)}
#bar .prog{position:absolute;left:0;right:0;bottom:0;height:3px}
#bar .prog i{display:block;height:100%;width:0;background:var(--verde);transition:width 1s linear}

/* reproductor grande */
#full{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));overflow:auto;background:var(--bg)}
#full.show{display:flex}
#f-bg{display:none}
#full .close{align-self:stretch;display:flex;justify-content:center;padding:12px}
#full .grab{width:46px;height:5px;border-radius:3px;background:var(--surface2);display:block}
#full .cover{width:min(84vw,360px,44vh);aspect-ratio:1;flex:none;border-radius:18px;overflow:hidden;background:var(--surface);border:1px solid var(--line);margin:8px 0 24px;display:flex;align-items:center;justify-content:center;box-shadow:0 16px 40px rgba(0,0,0,.45)}
#full .cover img{width:100%;height:100%;object-fit:cover}
#full .cover svg{width:34%;height:34%;fill:var(--soft)}
#full .info{align-self:stretch;text-align:center}
#full h3{font-family:News,Georgia,serif;font-weight:500;font-size:var(--s3);margin:0;line-height:1.2}
#full p{margin:6px 0 0;color:var(--soft)}
#f-prog{align-self:stretch;margin-top:20px}
#f-range{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent;margin:0}
#f-range::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--verde) var(--p,0%),var(--surface2) var(--p,0%))}
#f-range::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--ink);margin-top:-8px}
#full .times{display:flex;justify-content:space-between;font-size:15px;color:var(--soft);font-variant-numeric:tabular-nums}
#full .ctl{display:flex;align-items:center;justify-content:center;gap:28px;margin:18px 0 20px}
#full .ctl button{width:70px;height:70px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
#full .ctl button svg{fill:currentColor}
#full .ctl .pp{width:92px;height:92px;border-radius:24px;background:var(--rosso);color:#fff}
#full .ctl button:active{background:var(--surface)}
#full .ctl .pp:active{background:var(--rosso-d)}
#full .ctl button:disabled{opacity:.3}
#full .sleep{align-self:stretch;margin-top:auto;padding-top:8px}
#full .sleep b{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:400;color:var(--soft);margin-bottom:10px}
#full .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
#full .seg button{border-radius:12px;padding:12px 0;font-weight:700;text-align:center;font-size:17px;color:var(--soft)}
#full .seg button.on{background:var(--verde);color:#fff}
#full .err{background:var(--rosso);color:#fff;padding:10px 14px;border-radius:12px;margin-bottom:12px;display:none;align-self:stretch;text-align:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));z-index:15;max-width:88%;background:var(--surface2);color:var(--ink);border:1px solid var(--line);padding:12px 20px;border-radius:14px;font-size:17px;font-weight:700;text-align:center;transition:opacity .3s;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<header id="top">
  <button class="back" id="back" onclick="goBack()" aria-label="Volver"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <h1 id="title">Musica di Adorizia</h1>
</header>
<main>
  <!-- INICIO -->
  <section class="view on" id="v-home">
    <div class="home-top">
      <span class="mark" aria-hidden="true"><i style="background:#2EA06A"></i><i style="background:#F5F4EE"></i><i style="background:#D7333A"></i></span>
      <h1 class="hello" id="hello-txt">Ciao, Adorizia</h1>
      <p class="count" id="hero-count"></p>
    </div>

    <div class="composer">
      <button class="ask" onclick="show('search')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>¿Qué querés escuchar hoy?</button>
      <button class="play-all" onclick="playTodos()"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.87l11-6.5a1 1 0 0 0 0-1.74l-11-6.5A1 1 0 0 0 8 5.5z"/></svg>Escuchar música italiana</button>
    </div>

    <div class="chips" id="trio"></div>

    <button class="nowcard" id="nowcard" onclick="openFull()">
      <span class="art" id="now-art"></span>
      <span class="t"><small>Suena ahora</small><b id="now-title"></b><span id="now-artist"></span></span>
    </button>
  </section>

  <!-- CANTANTES -->
  <section class="view" id="v-artists"><div class="grid" id="artist-grid"></div></section>

  <!-- LOS DE MAMA -->
  <section class="view" id="v-fav"></section>

  <!-- BUSCAR -->
  <section class="view" id="v-search">
    <form onsubmit="event.preventDefault();doSearch()"><input class="search" id="sq" type="search" enterkeyhint="search" placeholder="Un cantante o una canción"></form>
    <button class="btn" onclick="doSearch()">Buscar</button>
    <div id="search-res"></div>
  </section>

  <!-- UN CANTANTE -->
  <section class="view" id="v-artist"></section>

  <!-- UN DISCO -->
  <section class="view" id="v-album"></section>
</main>

<!-- mini reproductor -->
<div id="bar" onclick="openFull(event)">
  <div class="art" id="bar-art"></div>
  <div class="t"><b id="bar-title"></b><span id="bar-artist"></span></div>
  <button class="pp" id="bar-pp" onclick="event.stopPropagation();Android.cmd('toggle')" aria-label="Pausa"></button>
  <button class="nx" id="bar-nx" onclick="event.stopPropagation();Android.cmd('next')" aria-label="Siguiente"></button>
  <div class="prog"><i id="bar-prog"></i></div>
</div>

<!-- reproductor grande -->
<div id="full">
  <div id="f-bg"></div>
  <button class="close" onclick="closeFull()" aria-label="Cerrar"><span class="grab"></span></button>
  <div class="cover" id="f-art"></div>
  <div class="info"><h3 id="f-title"></h3><p id="f-artist"></p></div>
  <div id="f-prog">
    <input type="range" id="f-range" min="0" max="1000" value="0" aria-label="Posición" oninput="this.style.setProperty('--p',this.value/10+'%')" onchange="Android.seek(Math.round(this.value/1000*S.dur))">
    <div class="times"><span id="f-pos">0:00</span><span id="f-dur">0:00</span></div>
  </div>
  <div class="ctl">
    <button id="f-prev" onclick="Android.cmd('prev')" aria-label="Anterior"></button>
    <button class="pp" id="f-pp" onclick="Android.cmd('toggle')" aria-label="Pausa"></button>
    <button id="f-next" onclick="Android.cmd('next')" aria-label="Siguiente"></button>
  </div>
  <div class="err" id="f-err"></div>
  <div class="sleep">
    <b id="f-sleep-txt"></b>
    <div class="seg">
      <button data-m="15" onclick="setSleep(15)">15 min</button>
      <button data-m="30" onclick="setSleep(30)">30 min</button>
      <button data-m="60" onclick="setSleep(60)">1 hora</button>
      <button data-m="0" onclick="setSleep(0)">No</button>
    </div>
  </div>
</div>

<script src="keys.js"></script>
<script>
'use strict';
// ---------- iconos (estilo Apple) ----------
const IC = {
  play: '<svg width="26" height="26" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.87l11-6.5a1 1 0 0 0 0-1.74l-11-6.5A1 1 0 0 0 8 5.5z"/></svg>',
  pause: '<svg width="26" height="26" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4.2" height="15" rx="1.3"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.3"/></svg>',
  next: '<svg width="34" height="34" viewBox="0 0 32 24"><path d="M3 5.3v13.4a1 1 0 0 0 1.5.86L15 13.1v5.6a1 1 0 0 0 1.5.86l11-6.7a1 1 0 0 0 0-1.72l-11-6.7A1 1 0 0 0 15 5.3v5.6L4.5 4.44A1 1 0 0 0 3 5.3z"/></svg>',
  prev: '<svg width="34" height="34" viewBox="0 0 32 24"><path d="M29 5.3v13.4a1 1 0 0 1-1.5.86L17 13.1v5.6a1 1 0 0 1-1.5.86l-11-6.7a1 1 0 0 1 0-1.72l11-6.7A1 1 0 0 1 17 5.3v5.6l10.5-6.46A1 1 0 0 1 29 5.3z"/></svg>',
  load: '<span class="spin" style="border-color:rgba(127,127,127,.35);border-top-color:currentColor;width:24px;height:24px"></span>',
  note: '<svg width="40%" height="40%" viewBox="0 0 24 24" fill="rgba(255,255,255,.9)"><path d="M9 17.5a3 3 0 1 1-2-2.83V5.6a1 1 0 0 1 .76-.97l10-2.5A1 1 0 0 1 19 3.1v11.4a3 3 0 1 1-2-2.83V7.3l-8 2v8.2z"/></svg>',
  mic: '🎤',
  moon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z"/></svg>',
  shuffle: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3.5c3.5 0 4.5 10 8 10H21M17.5 13.5L21 17l-3.5 3.5M3 17h3.5c1.4 0 2.4-1.6 3.3-3.5M14.5 7H21M17.5 3.5L21 7l-3.5 3.5"/></svg>',
};
// ---------- utilidades ----------
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s*\(\d+\)$/, '').toLowerCase()
  .replace(/\(.*?\)|\[.*?\]/g, ' ').replace(/[^a-z0-9]+/g, ' ').trim();
const fmt = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const store = {
  get(k, max) { try { const v = JSON.parse(localStorage.getItem(k)); if (v && (!max || Date.now() - v.t < max)) return v.d; } catch (e) {} return null; },
  set(k, d) { try { localStorage.setItem(k, JSON.stringify({ t: Date.now(), d })); } catch (e) {} },
};
const DAY = 86400000;

// pedidos por el celu (Kotlin) para no depender del navegador
let reqN = 0; const waiting = {};
window.__res = (id, status, text) => { const w = waiting[id]; if (!w) return; delete waiting[id]; w(status, text); };
function http(url) {
  return new Promise((ok, bad) => {
    const id = 'r' + (++reqN);
    waiting[id] = (st, txt) => {
      if (st >= 200 && st < 300) { try { ok(JSON.parse(txt)); } catch (e) { bad(e); } }
      else bad(Object.assign(new Error('HTTP ' + st), { status: st }));
    };
    Android.get(url, id);
  });
}
// Discogs sin token: maximo 25 pedidos por minuto, se hacen de a uno y se guardan
let dq = Promise.resolve();
function discogs(path) {
  const key = 'dg:' + path;
  const hit = store.get(key, 7 * DAY);
  if (hit) return Promise.resolve(hit);
  const p = dq.then(async () => {
    for (let i = 0; i < 3; i++) {
      const auth = window.DGK ? (path.includes('?') ? '&' : '?') + 'key=' + DGK + '&secret=' + DGS : '';
      try { const d = await http('https://api.discogs.com' + path + auth); store.set(key, d); return d; }
      catch (e) { if (e.status === 429) { await new Promise(r => setTimeout(r, 20000)); continue; } throw e; }
    }
    throw new Error('Discogs ocupado');
  });
  dq = p.catch(() => {}).then(() => new Promise(r => setTimeout(r, window.DGK ? 300 : 700)));
  return p;
}

const BADV = /full album|album completo|álbum completo|intervista|interview|karaoke|tutorial|reaction|8d audio|slowed|medley/i;
function ytId(u) { const m = /(?:v=|youtu\.be\/|embed\/)([\w-]{11})/.exec(u || ''); return m ? m[1] : null; }
function cleanTitle(t, artist) {
  let s = String(t || '');
  const a = norm(artist).split(' ')[0];
  s = s.replace(/\((official|video|audio|videoclip|lyric|testo|hd|hq|remaster)[^)]*\)|\[(official|video|audio|hd|hq|remaster)[^\]]*\]/gi, '');
  const parts = s.split(/\s[-–—]\s/);
  if (parts.length > 1 && norm(parts[0]).includes(a)) s = parts.slice(1).join(' - ');
  return s.replace(/\s{2,}/g, ' ').trim();
}
const tidy = t => String(t || '').replace(/\[[^\]]*\]/g, '').replace(/\((19|20)\d\d\)/g, '').replace(/\s{2,}/g, ' ').replace(/^[\s\-–—:]+|[\s\-–—:]+$/g, '').trim() || String(t || '');
// saca el nombre del cantante pegado al titulo ("Io Amo - Fausto Leali", "Fausto Leali: Io Amo")
// videos que no son una cancion (discos enteros, entrevistas, promos)
const NOSONG = /vinile|complete album|album complet|cd complet|disco complet|\bcompleto\b|vinyl|\blp\b|\bepk\b|best of|il meglio|greatest hits|full album|raccolta|grandi successi|medley|intervist|interview|speciale|documentar|backstage|making of|trailer/i;
function songTitle(t, artist) {
  const orig = tidy(t);
  let x = orig
    .replace(/[♫♪~|•►▶★]+/g, ' - ')
    .replace(/^\s*\d{1,2}\s*[.)\-]\s*/, '')
    .replace(/\s*[(\[][^)\]]*\b(testo|lyrics?|letra|subtit\w*|sottotit\w*|c\.c\.)[^)\]]*[)\]]/gi, '')
    .replace(/\s*\+?\s*\b(con\s+|with\s+)?(testo|lyrics?|letra|subtitulad\w*|sottotitol\w*)\b.*$/i, '')
    .replace(/\s*\((?=[^)]*(\d{4}|live|discoring|rai\b|tv|show|sanremo|remaster|mix|version|versione|cd\s*\d|track|titoli|official|video|audio|hd|italiano|italian|originale))[^)]*\)/gi, '')
    .replace(/\s*\b(movie\s+)?(official\s+)?(video\s*clip|videoclip|video|audio)(\s*(ufficiale|oficial|&\s*audio|restored|hd))*\s*(restored|hd)?\s*$/i, '')
    .replace(/\s*\bhd\b\s*$/i, '');
  x = x.replace(/\s+(19|20)\d\d\s*$/, '');
  const first = norm(artist).split(' ')[0];
  if (first.length > 2 && norm(x).includes(first)) {
    const q =x.match(/["“«]([^"”»]{2,})["”»]|''([^']{2,})''/);
    if (q) x = q[1] || q[2];
    else {
      const parts = x.split(/\s*[,]\s*|\.\s+|\s[-–—]\s|:\s|\s[-–—]|[-–—]\s/).map(p => p.trim()).filter(Boolean);
      const keep = parts.filter(p => !norm(p).includes(first) && !/collection|greatest|best of|album|raccolta/i.test(p));
      if (keep.length) x = keep[0];
    }
  }
  x = x.replace(/\s{2,}/g, ' ').replace(/^["'“”«»\s.,\-–—:]+|["'“”«»\s.,\-–—:]+$/g, '').trim();
  return x.length > 1 ? x : orig;
}
function ytItem(s, artist) {
  return { url: 'yt://' + s.y, title: s.ct || songTitle(s.t, artist), artist: artist + (s.yr ? ' · ' + s.yr : ''), art: 'https://i.ytimg.com/vi/' + s.y + '/hqdefault.jpg' };
}
function videosOf(m, artist, al) {
  const out = []; const seen = new Set();
  (m.videos || []).forEach(v => {
    const y = ytId(v.uri);
    if (!y || seen.has(y) || BADV.test(v.title || '') || (v.duration && (v.duration < 90 || v.duration > 600))) return;
    seen.add(y);
    out.push({ y, t: cleanTitle(v.title, artist), al: al && al.title, yr: (al && al.year) || m.year });
  });
  return out;
}
function songRow(s, artist, queue, i) {
  const b = document.createElement('button');
  b.className = 'row';
  b.innerHTML = rowHtml('https://i.ytimg.com/vi/' + s.y + '/mqdefault.jpg', IC.note, s.ct || songTitle(s.t, artist), (s.al ? s.al + ' · ' : '') + (s.yr || artist || ''));
  b.onclick = () => playQueue(queue, i);
  return b;
}
function allSongs() {
  const out = [];
  ARTISTS.forEach(a => (a.songs || []).forEach(s => out.push(ytItem(s, a.name))));
  return out;
}

async function loadAlbums(a) {
  if (a.albums && a.albums.length) return a.albums;
  const albums = [];
  const seen = new Set();
  for (let page = 1; page <= 2; page++) {
    const d = await discogs(`/artists/${a.id}/releases?sort=year&sort_order=desc&per_page=100&page=${page}`);
    (d.releases || []).forEach(r => {
      if (r.type !== 'master' || r.role !== 'Main' || !r.year) return;
      const k = norm(r.title); if (seen.has(k)) return; seen.add(k);
      albums.push({ id: r.id, title: r.title, year: r.year, cover: r.thumb || '' });
    });
    if (!d.pagination || page >= d.pagination.pages) break;
  }
  a.albums = albums;
  return albums;
}
async function loadSongs(a) {
  if (a.songs && a.songs.length) return a.songs;
  const albums = await loadAlbums(a);
  const songs = []; const seen = new Set();
  const step = Math.max(1, Math.floor(albums.length / 8));
  for (const al of albums.filter((_, i) => i % step === 0).slice(0, 8)) {
    try {
      const m = await discogs('/masters/' + al.id);
      videosOf(m, a.name, al).slice(0, 4).forEach(s => { const k = norm(s.t); if (!seen.has(k)) { seen.add(k); songs.push(s); } });
    } catch (e) {}
  }
  a.songs = songs;
  return songs;
}

async function doSearch() {
  const q = $('sq').value.trim();
  const box = $('search-res');
  if (q.length < 2) return;
  $('sq').blur();
  box.innerHTML = '';
  // 1) canciones que ya estan en la app (al instante)
  await artistsReady;
  const nq = norm(q);
  const hits = [];
  ARTISTS.forEach(a => (a.songs || []).forEach(s => { if (norm(s.t + ' ' + a.name).includes(nq)) hits.push(ytItem(s, a.name)); }));
  if (hits.length) {
    const L = grp(box, 'Canciones');
    hits.slice(0, 30).forEach((s, i) => {
      const b = document.createElement('button');
      b.className = 'row';
      b.innerHTML = rowHtml(s.art.replace('hqdefault', 'mqdefault'), IC.note, s.title, s.artist);
      b.onclick = () => playQueue(hits, i);
      L.appendChild(b);
    });
  }
  const wait = document.createElement('div'); wait.className = 'msg'; wait.innerHTML = '<span class="spin"></span> Buscando en Discogs…';
  box.appendChild(wait);
  if (!window.DGK) { wait.textContent = ''; if (!hits.length) box.innerHTML = '<div class="msg">No encontré nada con eso.</div>'; return; }
  try {
    const [ar, ms] = await Promise.all([
      discogs('/database/search?type=artist&per_page=6&q=' + encodeURIComponent(q)),
      discogs('/database/search?type=master&per_page=30&q=' + encodeURIComponent(q)),
    ]);
    if ($('sq').value.trim() !== q) return;
    wait.remove();
    const arts = (ar.results || []).slice(0, 4);
    if (arts.length) {
      const L = grp(box, 'Cantantes');
      arts.forEach(r => {
        const known = ARTISTS.find(a => a.id === r.id);
        const a = known || { name: r.title.replace(/\s*\(\d+\)$/, ''), id: r.id, photo: r.thumb || '' };
        const b = document.createElement('button');
        b.className = 'row';
        b.innerHTML = rowHtml(a.photo || r.thumb, '🎤', a.name, 'Ver canciones y discos', '›');
        b.onclick = () => openArtist(a);
        L.appendChild(b);
      });
    }
    const alb = (ms.results || []);
    if (alb.length) {
      const L = grp(box, 'Discos');
      alb.forEach(r => {
        const parts = r.title.split(' - ');
        const artist = parts.length > 1 ? parts[0].replace(/\s*\(\d+\)$/, '') : '';
        const al = { id: r.id, title: parts.length > 1 ? parts.slice(1).join(' - ') : r.title, year: r.year || '', cover: r.thumb || '' };
        const b = document.createElement('button');
        b.className = 'row';
        b.innerHTML = rowHtml(r.thumb, '💿', al.title, artist + (al.year ? ' · ' + al.year : ''), '›');
        b.onclick = () => openAlbum(artist, al);
        L.appendChild(b);
      });
    }
    if (!box.children.length) box.innerHTML = '<div class="msg">No encontré nada con eso.</div>';
  } catch (e) {
    wait.textContent = 'No se pudo buscar en Discogs. ¿Hay internet?';
  }
}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  $('f-next').disabled = !s.hasNext;
  $('bar-nx').style.opacity = s.hasNext ? 1 : .3;
  const p = s.dur > 0 ? Math.min(100, s.pos / s.dur * 100) : 0;
  $('bar-prog').style.width = p + '%';
  if (s.dur > 0) {
    if (document.activeElement !== $('f-range')) { $('f-range').value = Math.round(p * 10); $('f-range').style.setProperty('--p', p + '%'); }
    $('f-pos').textContent = fmt(s.pos); $('f-dur').textContent = '-' + fmt(s.dur - s.pos);
  }
  const e = $('f-err'); e.textContent = s.error; e.style.display = s.error ? 'block' : 'none';
  const left = s.sleepAt ? Math.max(0, Math.ceil((s.sleepAt - Date.now()) / 60000)) : 0;
  $('f-sleep-txt').innerHTML = IC.moon + (left ? ` Se apaga en ${left} min` : ' Apagar la música en…');
  if (!left) document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', false));
};
function setSleep(m) {
  Android.sleep(m);
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', +b.dataset.m === m && m > 0));
  toast(m ? `La música se apaga en ${m >= 60 ? '1 hora' : m + ' minutos'}` : 'Sin apagado automático');
}
function openFull() { if (!S.idle) $('full').classList.add('show'); }
function closeFull() { $('full').classList.remove('show'); }

// avisito abajo
let tt;
function toast(t) {
  let el = $('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
  el.textContent = t; el.style.opacity = 1;
  clearTimeout(tt); tt = setTimeout(() => el.style.opacity = 0, 2400);
}
</script>
